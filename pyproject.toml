[project]
name = "algebra-kiselev"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Roman", email = "pochta.roman.r.git@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.25.0",
    "marimo>=0.25.0",
    "mistralai>=2.10.1",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pypdfium2>=5.13.0",
    "python-dotenv>=1.2.3",
    "sympy>=1.14.0",
]

[project.scripts]
algebra-kiselev = "algebra_kiselev:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".agents",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501", # line too long (formatter handles it)
]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["F841", "E402", "B018", "W293"]
